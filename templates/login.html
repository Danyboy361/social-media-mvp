{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-intro"><p class="eyebrow">GOOD TO HAVE YOU BACK</p><h1>Pick up<br><span>the thread.</span></h1><p>Sign in to share a thought and catch up on the timeline.</p></div>
<div class="card auth-card"><h2>Welcome back</h2><p class="muted">Log in to your account.</p>
<form method="post" class="stack">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Log in ↗</button>
</form><p class="auth-switch">New to Chirp? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>
{% endblock %}

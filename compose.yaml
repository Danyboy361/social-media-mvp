services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-only-change-this-secret}
      DATABASE_PATH: /data/social.db
    volumes:
      - social_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  social_data:
